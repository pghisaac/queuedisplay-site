<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: white;
      color: black;
      overflow: hidden;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    .orders-panel {
      width: 33.33vw;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding: 10px 10px 0 10px;
    }

    .orders-panel h1 {
      font-size: 2.2em;
      margin: 20px 0 10px 0;
      text-align: center;
    }

    #displayOrders {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      grid-gap: 16px;
      width: 100%;
      height: calc(100vh - 100px);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Font sizes are in vw so a 7-character order always fits its tile. */
    .order {
      font-size: 3.3vw;
      height: 100%;
      min-width: 0;
      padding: 12px 8px;
      border: 4px solid black;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      box-sizing: border-box;
      background-clip: padding-box;
      line-height: 1.1;
      overflow: hidden;
    }

    .order.grabfood { font-size: 2.9vw; }
    .order.long { font-size: 2.5vw; }
    .order.grabfood.long { font-size: 2.2vw; }

    .grabfood { background: #00b74f; color: white; }
    .foodpanda { background: #e6007e; color: white; }
    .takeaway { background: #f0f0f0; color: black; }

    .platform-label {
      font-size: 0.5em;
      margin-bottom: 10px;
    }

    /* Newest order flashes in so it is easy to spot from across the room. */
    .order.new { animation: pop 0.6s ease-out; }
    @keyframes pop {
      0%   { transform: scale(0.85); opacity: 0.3; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    .right-image-panel {
      width: 66.67vw;
      height: 100vh;
      background: #222;
      position: relative;
      overflow: hidden;
    }

    .alt-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #222;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .alt-image.visible { opacity: 1; }
    video.alt-image { background: #000; }

    #entryInput {
      opacity: 0.15;
      width: 80px;
      height: 28px;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 999;
      border: none;
      background: #fff;
      color: #000;
      font-size: 16px;
      pointer-events: auto;
    }
  </style>
</head>

<body>

<div class="main-layout">

  <div class="orders-panel">
    <h1>Now Serving</h1>
    <div id="displayOrders"></div>
  </div>

  <div class="right-image-panel" id="mediaPanel"></div>

</div>

<audio id="ding" src="Ding-dong-sound.mp3" preload="auto"></audio>
<input type="text" id="entryInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="none" />

<script src="config.js"></script>
<script src="schedule.js"></script>
<script>
(function () {
  'use strict';

  var MAX_ORDERS = 10;
  var MAX_CHARS = 7;
  var REFOCUS_INTERVAL_MS = 2000;

  var orders = [];

  var displayEl = document.getElementById('displayOrders');
  var dingEl = document.getElementById('ding');
  var inputEl = document.getElementById('entryInput');

  /* ---------- Rendering ---------- */

  function showOrders(highlightFirst) {
    var frag = document.createDocumentFragment();

    orders.forEach(function (order, i) {
      var div = document.createElement('div');
      div.className = 'order ' + order.platform;
      if (order.text.length > 5) div.className += ' long';
      if (highlightFirst && i === 0) div.className += ' new';

      var label = document.createElement('div');
      label.className = 'platform-label';
      label.textContent = order.platformLabel;

      div.appendChild(label);
      div.appendChild(document.createTextNode(order.text));
      frag.appendChild(div);
    });

    displayEl.innerHTML = '';
    displayEl.appendChild(frag);
  }

  /* ---------- Sound ---------- */

  function playDing() {
    try {
      dingEl.pause();
      dingEl.currentTime = 0;
      var p = dingEl.play();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    } catch (e) {}
  }

  /* ---------- Orders ---------- */

  function clean(str) {
    return str.replace(/[^a-zA-Z0-9]/g, '');
  }

  function addOrder(raw) {
    var input = raw.trim();
    input = input.replace(/^[^a-zA-Z0-9]+/, '');
    input = input.replace(/[*\/-]/g, '');

    var platform = 'takeaway';
    var label = 'Takeaway';
    var formattedOrder = input;

    if (raw.charAt(0) === '*') {
      platform = 'grabfood';
      label = 'Grabfood';
      formattedOrder = 'GF-' + clean(raw.slice(1));
    } else if (raw.charAt(0) === '/') {
      platform = 'foodpanda';
      label = 'Foodpanda';
      formattedOrder = '#' + clean(raw.slice(1));
    }

    if (!formattedOrder) return;

    formattedOrder = formattedOrder.substring(0, MAX_CHARS);

    orders.unshift({
      text: formattedOrder,
      platform: platform,
      platformLabel: label
    });
    orders = orders.slice(0, MAX_ORDERS);

    try {
      localStorage.setItem('orders', JSON.stringify(orders));
    } catch (e) {}

    showOrders(true);
    playDing();
  }

  /* ---------- Keyboard / scanner input ---------- */

  function focusInput() {
    if (document.activeElement !== inputEl) inputEl.focus();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;

    var value = inputEl.value.trim();
    if (value) {
      addOrder(value);
      inputEl.value = '';
    }

    focusInput();
  });

  /* ---------- Right-hand media (scheduled from the admin page) ---------- */

  var cfg = window.QD_CONFIG || {};
  var Sched = window.QDSchedule;
  var panel = document.getElementById('mediaPanel');
  var hasBackend = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY);

  // Used when the backend is not set up, unreachable on first load, or nothing is scheduled right now.
  var FALLBACK = [
    { id: 'fb1', kind: 'image', url: 'OKNEXTV1_1.jpg', duration_s: 10 },
    { id: 'fb2', kind: 'image', url: 'OKNEXTV1_2.jpg', duration_s: 10 }
  ];

  var rows = [];            // everything fetched from Supabase (enabled rows)
  var currentKey = null;    // id of the item on screen
  var currentEl = null;
  var mediaTimer = null;

  function mediaUrl(m) {
    if (m.url) return m.url;
    return cfg.SUPABASE_URL + '/storage/v1/object/public/media/' +
      String(m.path).split('/').map(encodeURIComponent).join('/');
  }

  function activeList() {
    var now = Sched.nowParts();
    var list = rows.filter(function (m) { return Sched.isActive(m, now); });
    return list.length ? list : FALLBACK;
  }

  function nextAfter(list, key) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === key) return list[(i + 1) % list.length];
    }
    return list[0];
  }

  function swapIn(el) {
    var old = currentEl;
    panel.appendChild(el);
    // next frame so the opacity transition runs
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('visible'); }); });
    if (old) {
      old.classList.remove('visible');
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1000);
    }
    currentEl = el;
  }

  function playNext() {
    clearTimeout(mediaTimer);
    var list = activeList();
    var item = nextAfter(list, currentKey);
    var single = list.length === 1;

    // Only one item and it is already showing: nothing to reload, just check again later.
    if (single && item.id === currentKey) {
      mediaTimer = setTimeout(playNext, item.kind === 'video' ? 30000 : Math.max(5, item.duration_s || 10) * 1000);
      return;
    }

    var failed = false;
    function fail() {
      if (failed) return;
      failed = true;
      currentKey = item.id; // move on to the next one rather than retrying forever
      mediaTimer = setTimeout(playNext, 3000);
    }

    var el;
    if (item.kind === 'video') {
      el = document.createElement('video');
      el.className = 'alt-image';
      el.muted = true;
      el.setAttribute('muted', '');
      el.setAttribute('playsinline', '');
      el.preload = 'auto';
      el.loop = single;
      el.onerror = fail;
      el.onplaying = function () {
        if (failed || el === currentEl) return;
        currentKey = item.id;
        swapIn(el);
        // Videos play to the end; this is only a safety net for a stalled stream.
        clearTimeout(mediaTimer);
        mediaTimer = setTimeout(playNext, single ? 30000 : 10 * 60 * 1000);
      };
      el.onended = function () { if (!el.loop) playNext(); };
      el.src = mediaUrl(item);
      var p = el.play();
      if (p && typeof p.catch === 'function') p.catch(fail);
    } else {
      el = new Image();
      el.className = 'alt-image';
      el.alt = '';
      el.onerror = fail;
      el.onload = function () {
        if (failed) return;
        currentKey = item.id;
        swapIn(el);
        mediaTimer = setTimeout(playNext, Math.max(3, item.duration_s || 10) * 1000);
      };
      el.src = mediaUrl(item);
    }
  }

  function loadCachedRows() {
    try {
      var saved = JSON.parse(localStorage.getItem('qd_rows') || 'null');
      if (saved && saved.length) rows = saved;
    } catch (e) {}
  }

  function fetchRows() {
    if (!hasBackend || !window.fetch) return;
    var url = cfg.SUPABASE_URL + '/rest/v1/media?select=*&enabled=eq.true&order=sort.asc,created_at.asc';
    fetch(url, {
      headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + cfg.SUPABASE_ANON_KEY },
      cache: 'no-store'
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        rows = data;
        try { localStorage.setItem('qd_rows', JSON.stringify(data)); } catch (e) {}
        // First real list arrived while the bundled images are showing: switch over now.
        if (currentKey && currentKey.indexOf('fb') === 0 && data.length) playNext();
      })
      .catch(function () { /* keep showing what we have; try again next time */ });
  }

  function startMedia() {
    loadCachedRows();
    playNext();                    // show something immediately (cached list or bundled images)
    fetchRows();
    setInterval(fetchRows, Math.max(15, cfg.REFRESH_SECONDS || 60) * 1000);
  }

  /* ---------- Startup ---------- */

  window.onload = function () {
    try {
      localStorage.removeItem('orders');
    } catch (e) {}

    orders = [];
    showOrders(false);

    setTimeout(focusInput, 250);
    setInterval(focusInput, REFOCUS_INTERVAL_MS);
    inputEl.addEventListener('blur', function () { setTimeout(focusInput, 0); });

    startMedia();
  };
})();
</script>

</body>
</html>
