<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: white;
      color: black;
      overflow: hidden;
      cursor: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    .orders-panel {
      width: 33.33vw;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding: 10px 10px 0 10px;
    }

    .orders-panel h1 {
      font-size: 2.2em;
      margin: 20px 0 10px 0;
      text-align: center;
    }

    #displayOrders {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      grid-gap: 16px;
      width: 100%;
      height: calc(100vh - 100px);
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Font sizes are in vw so a 7-character order always fits its tile. */
    .order {
      font-size: 3.3vw;
      height: 100%;
      min-width: 0;
      padding: 12px 8px;
      border: 4px solid black;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      box-sizing: border-box;
      background-clip: padding-box;
      line-height: 1.1;
      overflow: hidden;
    }

    .order.grabfood { font-size: 2.9vw; }
    .order.long { font-size: 2.5vw; }
    .order.grabfood.long { font-size: 2.2vw; }

    .grabfood { background: #00b74f; color: white; }
    .foodpanda { background: #e6007e; color: white; }
    .takeaway { background: #f0f0f0; color: black; }

    .platform-label {
      font-size: 0.5em;
      margin-bottom: 10px;
    }

    /* Newest order flashes in so it is easy to spot from across the room. */
    .order.new { animation: pop 0.6s ease-out; }
    @keyframes pop {
      0%   { transform: scale(0.85); opacity: 0.3; }
      60%  { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    .right-image-panel {
      width: 66.67vw;
      height: 100vh;
      background: #222;
      position: relative;
      overflow: hidden;
    }

    .alt-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-color: #222;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .alt-image.visible { opacity: 1; }

    #entryInput {
      opacity: 0.15;
      width: 80px;
      height: 28px;
      position: absolute;
      left: 0;
      top: 0;
      z-index: 999;
      border: none;
      background: #fff;
      color: #000;
      font-size: 16px;
      pointer-events: auto;
    }
  </style>
</head>

<body>

<div class="main-layout">

  <div class="orders-panel">
    <h1>Now Serving</h1>
    <div id="displayOrders"></div>
  </div>

  <div class="right-image-panel">
    <img class="alt-image visible" src="OKNEXTV1_1.jpg" alt="">
    <img class="alt-image" src="OKNEXTV1_2.jpg" alt="">
  </div>

</div>

<audio id="ding" src="Ding-dong-sound.mp3" preload="auto"></audio>
<input type="text" id="entryInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="none" />

<script>
(function () {
  'use strict';

  var MAX_ORDERS = 10;
  var MAX_CHARS = 7;
  var IMAGE_INTERVAL_MS = 10000;
  var REFOCUS_INTERVAL_MS = 2000;

  var orders = [];

  var displayEl = document.getElementById('displayOrders');
  var dingEl = document.getElementById('ding');
  var inputEl = document.getElementById('entryInput');

  /* ---------- Rendering ---------- */

  function showOrders(highlightFirst) {
    var frag = document.createDocumentFragment();

    orders.forEach(function (order, i) {
      var div = document.createElement('div');
      div.className = 'order ' + order.platform;
      if (order.text.length > 5) div.className += ' long';
      if (highlightFirst && i === 0) div.className += ' new';

      var label = document.createElement('div');
      label.className = 'platform-label';
      label.textContent = order.platformLabel;

      div.appendChild(label);
      div.appendChild(document.createTextNode(order.text));
      frag.appendChild(div);
    });

    displayEl.innerHTML = '';
    displayEl.appendChild(frag);
  }

  /* ---------- Sound ---------- */

  function playDing() {
    try {
      dingEl.pause();
      dingEl.currentTime = 0;
      var p = dingEl.play();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    } catch (e) {}
  }

  /* ---------- Orders ---------- */

  function clean(str) {
    return str.replace(/[^a-zA-Z0-9]/g, '');
  }

  function addOrder(raw) {
    var input = raw.trim();
    input = input.replace(/^[^a-zA-Z0-9]+/, '');
    input = input.replace(/[*\/-]/g, '');

    var platform = 'takeaway';
    var label = 'Takeaway';
    var formattedOrder = input;

    if (raw.charAt(0) === '*') {
      platform = 'grabfood';
      label = 'Grabfood';
      formattedOrder = 'GF-' + clean(raw.slice(1));
    } else if (raw.charAt(0) === '/') {
      platform = 'foodpanda';
      label = 'Foodpanda';
      formattedOrder = '#' + clean(raw.slice(1));
    }

    if (!formattedOrder) return;

    formattedOrder = formattedOrder.substring(0, MAX_CHARS);

    orders.unshift({
      text: formattedOrder,
      platform: platform,
      platformLabel: label
    });
    orders = orders.slice(0, MAX_ORDERS);

    try {
      localStorage.setItem('orders', JSON.stringify(orders));
    } catch (e) {}

    showOrders(true);
    playDing();
  }

  /* ---------- Keyboard / scanner input ---------- */

  function focusInput() {
    if (document.activeElement !== inputEl) inputEl.focus();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;

    var value = inputEl.value.trim();
    if (value) {
      addOrder(value);
      inputEl.value = '';
    }

    focusInput();
  });

  /* ---------- Image rotation (cross-fade) ---------- */

  var images = document.querySelectorAll('.alt-image');
  var imgIndex = 0;

  function alternateImage() {
    if (images.length < 2) return;
    images[imgIndex].classList.remove('visible');
    imgIndex = (imgIndex + 1) % images.length;
    images[imgIndex].classList.add('visible');
  }

  /* ---------- Startup ---------- */

  window.onload = function () {
    try {
      localStorage.removeItem('orders');
    } catch (e) {}

    orders = [];
    showOrders(false);

    setTimeout(focusInput, 250);
    setInterval(focusInput, REFOCUS_INTERVAL_MS);
    inputEl.addEventListener('blur', function () { setTimeout(focusInput, 0); });

    setInterval(alternateImage, IMAGE_INTERVAL_MS);
  };
})();
</script>

</body>
</html>
